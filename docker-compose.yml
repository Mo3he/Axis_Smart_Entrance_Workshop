services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lab-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  node-red:
    build: ./node-red
    container_name: lab-node-red
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Rome
      - BROKER_HOST=${BROKER_HOST:-mosquitto}
    volumes:
      - node_red_data:/data

volumes:
  node_red_data:
